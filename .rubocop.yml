AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - bin/**/*
    - vendor/**/*
    # Preserve the deliberately faulty, line-referenced evaluation inputs.
    - evaluation/fixtures/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
